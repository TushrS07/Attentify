name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          rm -rf deploy deploy.tar.gz
          mkdir -p deploy

          cp backend/app.js deploy/
          cp -r backend/src deploy/src
          cp backend/package*.json deploy/
          cp backend/ecosystem.config.cjs deploy/

          tar -czf deploy.tar.gz -C deploy .

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Upload package
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          # SSH & deploy
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'

            cd  /home/ubuntu/project/Attentify/backend

            echo "Fixing ownership..."
            sudo chown -R $USER:$USER  /home/ubuntu/project/Attentify/backend

            # Backup current version
            if [ -f "package.json" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz \
                package.json ecosystem.config.cjs .env \
                server.js app.js routes controllers models 2>/dev/null || true
              ls -t backups/backup_*.tar.gz | tail -n +6 | xargs -r rm
            fi

            echo "Extracting new version..."
            tar --overwrite -xzf /tmp/deploy.tar.gz -C  /home/ubuntu/project/Attentify/backend
            rm /tmp/deploy.tar.gz

            echo "Installing production dependencies..."
            npm ci --omit=dev

            # Create .env only if not exists
            if [ ! -f .env ]; then
              echo "NODE_ENV=production" > .env
              echo "PORT=5000" >> .env
            fi

            mkdir -p logs

            # Start or reload with PM2
            if pm2 describe express-app > /dev/null 2>&1; then
              echo "Reloading PM2..."
              pm2 reload ecosystem.config.cjs --update-env
            else
              echo "Starting PM2..."
              pm2 start ecosystem.config.cjs
            fi

            pm2 save

          EOF

          rm private_key.pem
          
      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for app..."

          url="http://${EC2_HOST}/test"
          echo "Checking: $url"
    
          for i in {1..20}; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            
            echo "Attempt $i - HTTP $http_code"
            
            if [ "$http_code" = "200" ]; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 5
          done

          echo "Deployment failed"
          exit 1
      - name: Rollback on Failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'

            cd  /home/ubuntu/project/Attentify/backend

            latest_backup=$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)

            if [ -n "$latest_backup" ]; then
              echo "Rolling back..."
              tar -xzf "$latest_backup" -C  /home/ubuntu/project/Attentify/backend
              npm ci --omit=dev
              pm2 reload ecosystem.config.cjs
              echo "Rollback complete"
            else
              echo "No backup found"
            fi

          EOF

          rm private_key.pem
